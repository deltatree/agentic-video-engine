# Agent API (`openvideo serve`): rendert JSON-Projekte im Pod, Workspace auf einem PVC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-workspace
  labels:
    app.kubernetes.io/component: api
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/component: api
spec:
  # Der Job-Manager hält Jobs im Workspace: genau ein Pod je Workspace.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: s3-bucket
          image: ghcr.io/deltatree/openvideo-base
          command: [node, /app/deploy/s3-bucket.mjs]
          envFrom:
            - configMapRef: { name: openvideo-config }
          env:
            - name: OPENVIDEO_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: openvideo-secrets, key: s3-access-key-id }
            - name: OPENVIDEO_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: openvideo-secrets, key: s3-secret-access-key }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
      containers:
        - name: api
          image: ghcr.io/deltatree/openvideo-render-cpu
          args: [serve, --host, 0.0.0.0, --port, "7788"]
          envFrom:
            - configMapRef: { name: openvideo-config }
          env:
            - name: OPENVIDEO_WORKSPACE
              value: /workspace
            - name: OPENVIDEO_API_TOKEN
              valueFrom:
                secretKeyRef: { name: openvideo-secrets, key: api-token }
            # Erlaubte Host-Header (Service-Namen). Ingress-Namen im Overlay ergänzen.
            - name: OPENVIDEO_ALLOWED_HOSTS
              value: api,api.openvideo,api.openvideo.svc,api.openvideo.svc.cluster.local
            - name: OPENVIDEO_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: openvideo-secrets, key: s3-access-key-id }
            - name: OPENVIDEO_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: openvideo-secrets, key: s3-secret-access-key }
          ports:
            - { name: http, containerPort: 7788 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
          readinessProbe:
            httpGet: { path: /v1/health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /v1/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /cache }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: workspace
          persistentVolumeClaim: { claimName: api-workspace }
        - name: tmp
          emptyDir: { sizeLimit: 4Gi }
        - name: cache
          emptyDir: { sizeLimit: 10Gi }
        # Chromium braucht mehr Shared Memory als die 64 MiB, die Container sonst haben.
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/component: api
  ports:
    - { name: http, port: 7788, targetPort: http }
