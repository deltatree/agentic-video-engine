# Vorlage für die Geheimnisse. Ersetze jeden Wert vor dem Einsatz (siehe deploy/README.md).
# Das Overlay "production" erzeugt dieses Secret aus der Datei secrets.env.
apiVersion: v1
kind: Secret
metadata:
  name: openvideo-secrets
type: Opaque
stringData:
  # Bearer-Token der Agent API (Header "Authorization: Bearer <token>").
  api-token: REPLACE-WITH-A-LONG-RANDOM-API-TOKEN
  # Bearer-Token zwischen Koordinator, Workern und KEDA.
  worker-token: REPLACE-WITH-A-LONG-RANDOM-WORKER-TOKEN
  # Zugang zum S3-Speicher (für SeaweedFS frei wählbar).
  s3-access-key-id: REPLACE-WITH-ACCESS-KEY
  s3-secret-access-key: REPLACE-WITH-SECRET-KEY
