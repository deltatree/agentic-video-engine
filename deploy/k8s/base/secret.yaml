# Vorlage für die Geheimnisse. Ersetze jeden Wert vor dem Einsatz (siehe deploy/README.md).
# Das Overlay "production" erzeugt dieses Secret aus der Datei secrets.env.
apiVersion: v1
kind: Secret
metadata:
  name: openvideo-secrets
type: Opaque
# Koordinator und Worker verweigern den Start mit "REPLACE…"-Werten und Tokens unter 24 Zeichen.
stringData:
  # Bearer-Token der Agent API (Header "Authorization: Bearer <token>").
  api-token: REPLACE-WITH-A-LONG-RANDOM-API-TOKEN
  # Getrennte Koordinator-Rollen (Story 16.3): jede Rolle ein eigenes Token.
  # submit: Agent API reicht Jobs ein und fragt sie ab.
  submit-token: REPLACE-WITH-A-LONG-RANDOM-SUBMIT-TOKEN
  # worker: lease, heartbeat, complete, fail.
  worker-token: REPLACE-WITH-A-LONG-RANDOM-WORKER-TOKEN
  # metrics: nur GET /v1/queue (KEDA).
  metrics-token: REPLACE-WITH-A-LONG-RANDOM-METRICS-TOKEN
  # Getrennte S3-Identitäten (T8, ADR 0023), alle für SeaweedFS frei wählbar:
  # admin legt nur den Bucket an (Init-Container), api liest und schreibt alles,
  # worker liest nur inputs/ und schreibt nur jobs/.
  s3-admin-access-key-id: REPLACE-WITH-ADMIN-ACCESS-KEY
  s3-admin-secret-access-key: REPLACE-WITH-ADMIN-SECRET-KEY
  s3-api-access-key-id: REPLACE-WITH-API-ACCESS-KEY
  s3-api-secret-access-key: REPLACE-WITH-API-SECRET-KEY
  s3-worker-access-key-id: REPLACE-WITH-WORKER-ACCESS-KEY
  s3-worker-secret-access-key: REPLACE-WITH-WORKER-SECRET-KEY
