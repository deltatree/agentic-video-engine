# CPU-Worker: 2D, Browser (SwiftShader) und Encoding auf der CPU. Queue "cpu" (Port 8080).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-cpu
  labels:
    app.kubernetes.io/component: worker
    openvideo.io/worker-class: cpu
spec:
  # Keine feste Replikazahl: KEDA (autoscaling.yaml) steuert die Größe.
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      openvideo.io/worker-class: cpu
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        openvideo.io/worker-class: cpu
    spec:
      automountServiceAccountToken: false
      # SIGTERM: der Worker gibt den laufenden Chunk an den Koordinator zurück.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/deltatree/openvideo-worker
          command: [/usr/bin/tini, --, openvideo-worker]
          args: [--coordinator, "http://coordinator:8080"]
          envFrom:
            - configMapRef: { name: openvideo-config }
          env:
            - name: OPENVIDEO_WORKER_TOKEN
              valueFrom:
                secretKeyRef: { name: openvideo-secrets, key: worker-token }
            # S3-Identität "worker": liest inputs/, schreibt nur jobs/ (T8).
            - name: OPENVIDEO_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: openvideo-secrets, key: s3-worker-access-key-id }
            - name: OPENVIDEO_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: openvideo-secrets, key: s3-worker-secret-access-key }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "2", memory: 4Gi }
          # Der Worker hat keinen eigenen HTTP-Port. Bereit ist er, wenn er seinen Koordinator
          # erreicht; die Liveness-Probe startet ihn neu, wenn das dauerhaft nicht gelingt.
          readinessProbe:
            exec:
              command: [node, /app/deploy/healthcheck.mjs, "http://coordinator:8080/metrics"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [node, /app/deploy/healthcheck.mjs, "http://coordinator:8080/metrics"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /cache }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 4Gi }
        - name: cache
          emptyDir: { sizeLimit: 20Gi }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
---
# GPU-Worker: NVIDIA-GPU, NVENC. Eigene Queue "gpu" (Port 8081).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-gpu
  labels:
    app.kubernetes.io/component: worker
    openvideo.io/worker-class: gpu
spec:
  # Keine feste Replikazahl: KEDA (autoscaling.yaml) steuert die Größe.
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      openvideo.io/worker-class: gpu
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        openvideo.io/worker-class: gpu
    spec:
      automountServiceAccountToken: false
      # SIGTERM: der Worker gibt den laufenden Chunk an den Koordinator zurück.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Nur auf GPU-Knoten (Label vom NVIDIA GPU Operator / GPU Feature Discovery).
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: worker
          image: ghcr.io/deltatree/openvideo-render-gpu
          command: [/usr/bin/tini, --, openvideo-worker]
          args: [--coordinator, "http://coordinator:8081"]
          envFrom:
            - configMapRef: { name: openvideo-config }
          env:
            # WebGL/WebGPU von three und pixi auf der GPU (nativer ANGLE statt SwiftShader, ADR 0019).
            # Nicht bitgleich zu CPU-Workern; der Modus steht im Cache-Schlüssel (browser-gpu: native).
            - name: OPENVIDEO_BROWSER_GPU
              value: "1"
            - name: OPENVIDEO_WORKER_TOKEN
              valueFrom:
                secretKeyRef: { name: openvideo-secrets, key: worker-token }
            # S3-Identität "worker": liest inputs/, schreibt nur jobs/ (T8).
            - name: OPENVIDEO_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: openvideo-secrets, key: s3-worker-access-key-id }
            - name: OPENVIDEO_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: openvideo-secrets, key: s3-worker-secret-access-key }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: "2", memory: 4Gi, nvidia.com/gpu: 1 }
            limits: { cpu: "4", memory: 8Gi, nvidia.com/gpu: 1 }
          # Der Worker hat keinen eigenen HTTP-Port. Bereit ist er, wenn er seinen Koordinator
          # erreicht; die Liveness-Probe startet ihn neu, wenn das dauerhaft nicht gelingt.
          readinessProbe:
            exec:
              command: [node, /app/deploy/healthcheck.mjs, "http://coordinator:8081/metrics"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [node, /app/deploy/healthcheck.mjs, "http://coordinator:8081/metrics"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /cache }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 4Gi }
        - name: cache
          emptyDir: { sizeLimit: 20Gi }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
---
