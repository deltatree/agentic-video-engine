# Kleine Ressourcen für kind (ein Knoten, Laptop).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio
spec:
  template:
    spec:
      containers:
        - name: studio
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
spec:
  template:
    spec:
      containers:
        - name: coordinator
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-cpu
spec:
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-blender
spec:
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 2Gi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: object-storage
spec:
  template:
    spec:
      containers:
        - name: seaweedfs
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 1Gi }
