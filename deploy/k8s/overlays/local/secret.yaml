# Feste Werte NUR für den lokalen Test-Cluster. Niemals in Produktion verwenden.
apiVersion: v1
kind: Secret
metadata:
  name: openvideo-secrets
# Tokens mit mindestens 24 Zeichen, sonst startet der Koordinator nicht (Epic 16).
stringData:
  api-token: local-api-token-0123456789
  submit-token: local-submit-token-0123456789
  worker-token: local-worker-token-0123456789
  metrics-token: local-metrics-token-0123456789
  s3-admin-access-key-id: localadmin
  s3-admin-secret-access-key: localadminsecret123
  s3-api-access-key-id: localapi
  s3-api-secret-access-key: localapisecret123
  s3-worker-access-key-id: localworker
  s3-worker-secret-access-key: localworkersecret123
