# Produktion: Images mit fester Version aus ghcr.io, Geheimnisse aus secrets.env.
#
# Vor dem Einsatz:
#   cp secrets.env.example secrets.env   # Werte ersetzen, Datei nie einchecken
#   kubectl apply -k deploy/k8s/overlays/production
# Update oder Rollback: newTag unten ändern und erneut anwenden (siehe deploy/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - { name: ghcr.io/deltatree/openvideo-base, newTag: 0.1.0 }
  - { name: ghcr.io/deltatree/openvideo-render-cpu, newTag: 0.1.0 }
  - { name: ghcr.io/deltatree/openvideo-render-gpu, newTag: 0.1.0 }
  - { name: ghcr.io/deltatree/openvideo-blender, newTag: 0.1.0 }
  - { name: ghcr.io/deltatree/openvideo-studio, newTag: 0.1.0 }
  - { name: ghcr.io/deltatree/openvideo-worker, newTag: 0.1.0 }
secretGenerator:
  - name: openvideo-secrets
    behavior: replace
    envs:
      - secrets.env
    options:
      # KEDA (TriggerAuthentication) nennt das Secret beim Namen; kein Hash-Suffix.
      disableNameSuffixHash: true
