# Produktion plus Prometheus: Worker skalieren zusätzlich über die Render-Dauer.
#
# Voraussetzung: Prometheus sammelt die OpenVideo-Metrik render_duration (Histogramm in
# Sekunden) und ist unter der Adresse unten erreichbar (Namespace "monitoring").
# Einsatz: kubectl apply -k deploy/k8s/overlays/prometheus
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../production
  - networkpolicy.yaml
patches:
  # Die API exportiert ihre Metriken (u. a. render_duration) für Prometheus auf Port 9464.
  - target: { kind: Deployment, name: api }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: OPENVIDEO_METRICS, value: prometheus }
      - op: add
        path: /spec/template/metadata/annotations
        value: { prometheus.io/scrape: "true", prometheus.io/port: "9464" }
  - target: { kind: ScaledObject }
    patch: |-
      - op: add
        path: /spec/triggers/-
        value:
          type: prometheus
          name: render-duration
          metadata:
            serverAddress: http://prometheus-operated.monitoring.svc.cluster.local:9090
            # 90. Perzentil der Render-Dauer der letzten 5 Minuten. Über 120 s: ein Worker mehr
            # je 120 s Render-Dauer.
            query: histogram_quantile(0.9, sum(rate(render_duration_seconds_bucket{namespace="openvideo"}[5m])) by (le))
            threshold: "120"
            activationThreshold: "0"
