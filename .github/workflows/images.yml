# Baut die offiziellen Images (A44) bei einem Versions-Tag und veröffentlicht sie in GHCR.
# Tags je Image: ghcr.io/deltatree/openvideo-<ziel>:<version> und :<version>-<git-sha>,
# mit Provenance-Attestierung und SBOM.
name: Images

on:
  push:
    tags: ['v*']

# Lieferkette (Story 16.6): Rechte nur im Job, Actions per Commit-SHA gepinnt (Tag als Kommentar).
permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Tag passt zur Version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}." >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login bei GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Images bauen und veröffentlichen
        env:
          REGISTRY: ghcr.io/deltatree
          PUSH: '1'
        run: bash deploy/docker/build.sh
