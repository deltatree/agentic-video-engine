# Quality Gates (Auftrag A37, NFR-6): kein Merge bei TypeScript-, Lint-, Test-, E2E- oder
# Golden-Fehlern, Schwachstellen ab "high", Lizenzverstößen oder veraltetem JSON Schema.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lieferkette (Story 16.6): keine Rechte auf Workflow-Ebene, jeder Job nennt seine eigenen.
# Actions sind per Commit-SHA gepinnt (Tag als Kommentar); Dependabot hält sie aktuell.
# Jeder Download wird gegen eine feste SHA-256-Prüfsumme geprüft.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      OPENVIDEO_FFMPEG: /usr/local/bin/ffmpeg
      OPENVIDEO_FFPROBE: /usr/local/bin/ffprobe
      # Statischer FFmpeg-Build (BtbN, Monats-Build bleibt dauerhaft verfügbar) mit allen Encodern.
      # Prüfsumme aus checksums.sha256 derselben Release, lokal nachgerechnet.
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-12-31-14-28/ffmpeg-n7.1.3-22-g40b336e650-linux64-gpl-7.1.tar.xz
      FFMPEG_SHA256: 93eb3fada185ed547c3150e7d3151b04ec2cd14b12c9d6c92983b0794450fc69
      # Wie deploy/docker/Dockerfile (ARG BLENDER_SHA256).
      BLENDER_SHA256: bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
      # Chrome for Testing in der Revision von playwright-core, wie deploy/docker/Dockerfile (chromium-fetch).
      CHROMIUM_VERSION: 153.0.8010.12
      CHROMIUM_REVISION: '1243'
      CHROMIUM_SHA256: 8aac35011c18f6e2d10696154af89a5728ac2ddd6dc6fad24ffdf243c3fcfd5a
      CHROMIUM_HEADLESS_SHELL_SHA256: a9da028861a0cf789ff25c2fed45f5f1aaf969ed9247835b6a7821a4f7af9d1d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: FFmpeg 7.1 (statischer Build, SHA-256 geprüft)
        run: |
          curl -fsSL "$FFMPEG_URL" -o ff.tar.xz
          echo "${FFMPEG_SHA256}  ff.tar.xz" | sha256sum -c -
          tar xf ff.tar.xz
          sudo cp ffmpeg-*/bin/ffmpeg ffmpeg-*/bin/ffprobe /usr/local/bin/
          rm -rf ff.tar.xz ffmpeg-*/
          ffmpeg -version | head -1
      - name: Blender 4.2 LTS (Cache)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/opt/blender-4.2.23-linux-x64
          key: blender-4.2.23-${{ env.BLENDER_SHA256 }}
      - name: Blender und espeak-ng
        run: |
          if [ ! -x ~/.local/opt/blender-4.2.23-linux-x64/blender ]; then
            mkdir -p ~/.local/opt
            curl -fsSL https://download.blender.org/release/Blender4.2/blender-4.2.23-linux-x64.tar.xz -o blender.tar.xz
            echo "${BLENDER_SHA256}  blender.tar.xz" | sha256sum -c -
            tar xJf blender.tar.xz -C ~/.local/opt
            rm blender.tar.xz
          fi
          sudo apt-get update && sudo apt-get install -y espeak-ng libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libegl-mesa0 libglx-mesa0 libxxf86vm1 libxfixes3 libxrender1
          echo "OPENVIDEO_BLENDER=$HOME/.local/opt/blender-4.2.23-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Abhängigkeiten
        run: npm ci
      - name: Chromium für Playwright (SHA-256 geprüft)
        run: |
          node -e "const b=require('./node_modules/playwright-core/browsers.json').browsers.find((x)=>x.name==='chromium');if(b.revision!==process.env.CHROMIUM_REVISION){console.error('playwright-core expects Chromium '+b.revision+'; update CHROMIUM_* in ci.yml and the Dockerfile.');process.exit(1)}"
          base="https://cdn.playwright.dev/builds/cft/${CHROMIUM_VERSION}/linux64"
          dir="$HOME/.cache/ms-playwright"
          curl -fsSL "$base/chrome-linux64.zip" -o chrome.zip
          curl -fsSL "$base/chrome-headless-shell-linux64.zip" -o shell.zip
          echo "${CHROMIUM_SHA256}  chrome.zip" | sha256sum -c -
          echo "${CHROMIUM_HEADLESS_SHELL_SHA256}  shell.zip" | sha256sum -c -
          mkdir -p "$dir/chromium-${CHROMIUM_REVISION}" "$dir/chromium_headless_shell-${CHROMIUM_REVISION}"
          unzip -q chrome.zip -d "$dir/chromium-${CHROMIUM_REVISION}"
          unzip -q shell.zip -d "$dir/chromium_headless_shell-${CHROMIUM_REVISION}"
          touch "$dir/chromium-${CHROMIUM_REVISION}/INSTALLATION_COMPLETE" "$dir/chromium_headless_shell-${CHROMIUM_REVISION}/INSTALLATION_COMPLETE"
          rm chrome.zip shell.zip
          npx playwright install-deps chromium
      - name: OS-Sandbox für Chromium (HTML-Skripte laufen nur mit ihr, Story 16.1)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Abhängigkeitsregeln (AD-14)
        run: npm run check:deps
      - name: Build (TypeScript, Bundles, JSON Schema)
        run: npm run build
      - name: JSON Schema ist aktuell (API-Schema-Verstoß)
        run: git diff --exit-code packages/schema/openvideo.schema.json
      - name: Lint (strenges TypeScript)
        run: npm run lint
      - name: Lizenzen
        run: node scripts/licenses.mjs --check
      - name: Schwachstellen ab high
        run: npm audit --omit=dev --audit-level=high
      - name: Tests (Unit, Property, Integration, Golden, Audio, E2E, Determinismus, Security)
        run: npm test
      - name: Diff-Bilder bei Golden-Fehlern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-diffs
          path: |
            packages/*/test/golden/*.actual.png
            packages/*/test/golden/*.diff.png
          if-no-files-found: ignore
