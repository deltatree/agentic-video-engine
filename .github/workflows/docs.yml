# API-Referenz (Story 19.8): TypeDoc-HTML aller Pakete auf GitHub Pages.
# Die Ausgabe (über 1800 Dateien, mehrere MB) wird nicht eingecheckt; lokal erzeugt `npm run docs`
# die Markdown-Fassung in docs/api/ (in .gitignore).
# Voraussetzung: Repository-Einstellung Pages → Source „GitHub Actions“ (docs/guide/maintainers.md).
name: API reference

on:
  push:
    branches: [main]
  workflow_dispatch:

# Lieferkette (Story 16.6): keine Rechte auf Workflow-Ebene; Actions per Commit-SHA gepinnt (Tag als Kommentar).
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten
        run: npm ci
      - name: Build (TypeScript-Deklarationen für TypeDoc)
        run: npm run build
      - name: TypeDoc als HTML (typedoc.json ohne Markdown-Plugin)
        run: |
          node -e "const c=require('./typedoc.json');for(const k of ['plugin','hidePageHeader','hideBreadcrumbs','useCodeBlocks'])delete c[k];c.out='_site';require('fs').writeFileSync('typedoc.pages.json',JSON.stringify(c,null,2))"
          npx typedoc --options typedoc.pages.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
