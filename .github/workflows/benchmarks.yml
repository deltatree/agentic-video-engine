# Nightly-Benchmark mit Baseline-Vergleich (Story 22.3, Testplan „Performance: nightly + manuell“).
#
# Szenarien: alle sieben in 1080p30, 1080p60 und 4k30. Verglichen werden fps, Spitzen-RAM,
# Startzeit, Encoder-fps und Cache-Quote, jede Metrik mit eigener Toleranz (compareToBaseline).
# Ein Benchmark ist nur auf derselben Maschine vergleichbar: Die Basis liegt im Actions-Cache unter
# dem Hash der Maschinenbeschreibung (CPU, Kerne, RAM, Plattform, GPU). Gibt es für den Runner noch
# keine Basis, misst der erste Lauf sie (grün, mit Hinweis). Danach ist jede Regression rot.
# Neue Basis bewusst setzen: workflow_dispatch mit update_baseline=true.
name: Benchmarks

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Messung als neue Basis für diesen Runner-Typ speichern (kein Vergleich)'
        type: boolean
        default: false
      frames:
        description: 'Frames je Szenario'
        default: '10'

# Lieferkette (Story 16.6): Rechte nur im Job, Actions per Commit-SHA gepinnt (Tag als Kommentar).
permissions: {}

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      OPENVIDEO_FFMPEG: /usr/local/bin/ffmpeg
      OPENVIDEO_FFPROBE: /usr/local/bin/ffprobe
      # Wie ci.yml (dort begründet und gepflegt).
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-12-31-14-28/ffmpeg-n7.1.3-22-g40b336e650-linux64-gpl-7.1.tar.xz
      FFMPEG_SHA256: 93eb3fada185ed547c3150e7d3151b04ec2cd14b12c9d6c92983b0794450fc69
      CHROMIUM_VERSION: 153.0.8010.12
      CHROMIUM_REVISION: '1243'
      CHROMIUM_SHA256: 8aac35011c18f6e2d10696154af89a5728ac2ddd6dc6fad24ffdf243c3fcfd5a
      CHROMIUM_HEADLESS_SHELL_SHA256: a9da028861a0cf789ff25c2fed45f5f1aaf969ed9247835b6a7821a4f7af9d1d
      # Feste Encoder-Threads: vergleichbare Encoding-Werte zwischen Läufen.
      OPENVIDEO_ENCODER_THREADS: '4'
      BENCH_FRAMES: ${{ inputs.frames || '10' }}
      BASELINE: ${{ github.workspace }}/bench-baseline/baseline.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: FFmpeg 7.1 (statischer Build, SHA-256 geprüft)
        run: |
          curl -fsSL "$FFMPEG_URL" -o ff.tar.xz
          echo "${FFMPEG_SHA256}  ff.tar.xz" | sha256sum -c -
          tar xf ff.tar.xz
          sudo cp ffmpeg-*/bin/ffmpeg ffmpeg-*/bin/ffprobe /usr/local/bin/
          rm -rf ff.tar.xz ffmpeg-*/
      - name: Abhängigkeiten
        run: npm ci
      - name: Chromium für Playwright (SHA-256 geprüft)
        run: |
          base="https://cdn.playwright.dev/builds/cft/${CHROMIUM_VERSION}/linux64"
          dir="$HOME/.cache/ms-playwright"
          curl -fsSL "$base/chrome-linux64.zip" -o chrome.zip
          curl -fsSL "$base/chrome-headless-shell-linux64.zip" -o shell.zip
          echo "${CHROMIUM_SHA256}  chrome.zip" | sha256sum -c -
          echo "${CHROMIUM_HEADLESS_SHELL_SHA256}  shell.zip" | sha256sum -c -
          mkdir -p "$dir/chromium-${CHROMIUM_REVISION}" "$dir/chromium_headless_shell-${CHROMIUM_REVISION}"
          unzip -q chrome.zip -d "$dir/chromium-${CHROMIUM_REVISION}"
          unzip -q shell.zip -d "$dir/chromium_headless_shell-${CHROMIUM_REVISION}"
          touch "$dir/chromium-${CHROMIUM_REVISION}/INSTALLATION_COMPLETE" "$dir/chromium_headless_shell-${CHROMIUM_REVISION}/INSTALLATION_COMPLETE"
          rm chrome.zip shell.zip
          npx playwright install-deps chromium
      - name: Build
        run: npm run build
      - name: Maschinenschlüssel
        id: machine
        run: |
          node --input-type=module -e "
            import { createHash } from 'node:crypto';
            import { describeMachine, machineKey } from './packages/benchmarks/dist/index.js';
            const key = machineKey(describeMachine());
            console.log('key=' + key);
            console.log('hash=' + createHash('sha256').update(key).digest('hex').slice(0, 16));
          " | tee -a "$GITHUB_OUTPUT"
      - name: Basis dieses Runner-Typs laden
        id: restore
        if: ${{ inputs.update_baseline != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench-baseline
          key: bench-baseline-${{ steps.machine.outputs.hash }}-${{ github.run_id }}
          restore-keys: bench-baseline-${{ steps.machine.outputs.hash }}-
      - name: Wall-Clock-Tests (OV_PERF_STRICT=1)
        env:
          OV_PERF_STRICT: '1'
        run: npx vitest run packages/compositor
      - name: Benchmarks messen und vergleichen
        id: bench
        run: |
          mkdir -p bench-out bench-baseline
          args=(--scenario all --resolution 1080p30,1080p60,4k30 --frames "$BENCH_FRAMES" --json --baseline "$BASELINE")
          if [ -f "$BASELINE" ]; then
            echo "mode=compare" >> "$GITHUB_OUTPUT"
            set +e
            node packages/benchmarks/dist/bin.js "${args[@]}" --compare --require-comparison > bench-out/results.json 2> bench-out/bench.log
            code=$?
            set -e
          else
            echo "mode=seed" >> "$GITHUB_OUTPUT"
            set +e
            node packages/benchmarks/dist/bin.js "${args[@]}" --update-baseline > bench-out/results.json 2> bench-out/bench.log
            code=$?
            set -e
          fi
          cp "$BASELINE" bench-out/baseline.json 2>/dev/null || true
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          cat bench-out/bench.log
      - name: Zusammenfassung
        if: always()
        run: |
          node --input-type=module -e "
            import { readFileSync, existsSync } from 'node:fs';
            import { formatRegression } from './packages/benchmarks/dist/index.js';
            const out = [];
            out.push('## Benchmarks (' + (process.env.MODE || 'n/a') + ')', '', 'Machine: ' + process.env.MACHINE, '');
            if (existsSync('bench-out/results.json')) {
              const r = JSON.parse(readFileSync('bench-out/results.json', 'utf8'));
              out.push('| Szenario | Auflösung | fps | RAM MB | Startup ms | Encoder fps | Cache |', '|---|---|---:|---:|---:|---:|---:|');
              for (const x of r.results ?? []) out.push('| ' + [x.scenario, x.resolution, x.framesPerSecond.toFixed(2), Math.round(x.peakRssMb), Math.round(x.startupMs), x.encoding.framesPerSecond === null ? '–' : x.encoding.framesPerSecond.toFixed(1), (x.cacheHitRatio * 100).toFixed(0) + ' %'].join(' | ') + ' |');
              for (const f of r.failures ?? []) out.push('', 'FAILED ' + f.scenario + ' ' + f.resolution + ': ' + f.code + ' ' + f.problem);
              const c = r.comparison;
              if (c) {
                out.push('', 'Compared: ' + c.compared + ' (' + c.comparedMetrics + ' metrics), regressions: ' + c.regressions.length + ', skipped: ' + c.skipped.length);
                for (const g of c.regressions) out.push('- ' + formatRegression(g));
                for (const s of c.skipped) out.push('- skipped ' + s.scenario + ' ' + s.resolution + ': ' + s.reason);
              }
            }
            if (process.env.MODE === 'seed') out.push('', 'No baseline for this runner type yet: this run was stored as the baseline.');
            console.log(out.join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
        env:
          MODE: ${{ steps.bench.outputs.mode }}
          MACHINE: ${{ steps.machine.outputs.key }}
      - name: Ergebnis als Artefakt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: bench-out/
          if-no-files-found: warn
      - name: Neue Basis speichern
        if: ${{ steps.bench.outputs.mode == 'seed' && steps.bench.outputs.code == '0' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench-baseline
          key: bench-baseline-${{ steps.machine.outputs.hash }}-${{ github.run_id }}
      - name: Rot bei Regression oder Fehler
        run: |
          code="${{ steps.bench.outputs.code }}"
          if [ "$code" = "1" ]; then echo "::error::Benchmark regression (see summary and artifact benchmark-results)"; exit 1; fi
          if [ "$code" != "0" ]; then echo "::error::Benchmark failed with exit code $code"; exit 1; fi
